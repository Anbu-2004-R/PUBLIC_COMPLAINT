services:
  # 1. Backend Service (Spring Boot 3 + Java 17)
  - type: web
    name: civicpulse-backend
    env: java
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/civicconnect-backend-1.0.0.jar
    healthCheckPath: /api/v1/categories
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://civicpulse-frontend.onrender.com,http://localhost:3000
      - key: CLIENT_BASE_URL
        value: https://civicpulse-frontend.onrender.com
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: 587
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false

  # 2. Frontend Static Site (React 19 + Vite 8)
  - type: web
    name: civicpulse-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_MODE
        value: real
      - key: VITE_API_BASE_URL
        value: https://civicpulse-backend.onrender.com/api/v1
      - key: VITE_PHONE_DEFAULT_PREFIX
        value: "+91"
